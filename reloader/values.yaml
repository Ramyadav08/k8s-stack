# Generated from deployments/kubernetes/templates/chart/values.yaml.tmpl
global:
 
  imageRegistry: ""
  imagePullSecrets: []
  #imagePullSecrets:
  #  - name: my-pull-secret

kubernetes:
  host: https://kubernetes.default

nameOverride: ""
fullnameOverride: ""

image:
  name: stakater/reloader
  repository: ghcr.io/stakater/reloader
  tag: v1.4.4
  
  pullPolicy: IfNotPresent

reloader:
  autoReloadAll: false
  isArgoRollouts: false
  isOpenshift: false
  ignoreSecrets: false
  ignoreConfigMaps: false
  ignoreJobs: false
  ignoreCronJobs: false
  reloadOnCreate: false
  reloadOnDelete: false
  syncAfterRestart: false
  reloadStrategy: default # Set to default, env-vars or annotations
  ignoreNamespaces: "" # Comma separated list of namespaces to ignore
  namespaceSelector: "" # Comma separated list of k8s label selectors for namespaces selection
  resourceLabelSelector: "" # Comma separated list of k8s label selectors for configmap/secret selection
  logFormat: "" # json
  logLevel: info # Log level to use (trace, debug, info, warning, error, fatal and panic)
  watchGlobally: true
  # Set to true to enable leadership election allowing you to run multiple replicas
  enableHA: false
  # Set to true if you have a pod security policy that enforces readOnlyRootFilesystem
  readOnlyRootFileSystem: false
  legacy:
    rbac: false
  matchLabels: {}
  enableMetricsByNamespace: false
  deployment:
    # If you wish to run multiple replicas set reloader.enableHA = true
    replicas: 1

    revisionHistoryLimit: 2

    nodeSelector:

    affinity: {}

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      {}

    tolerations: []


    topologySpreadConstraints: []

    annotations: {}
    labels:
      provider: stakater
      group: com.stakater.platform
      version: v1.4.4

    env:
      open:
      secret:

      field:

      existing:


    livenessProbe: {}

    readinessProbe: {}
    
    resources: {}
    pod:
      annotations: {}
    priorityClassName: ""

    gomaxprocsOverride: ""
    gomemlimitOverride: ""

  service:
    {}


  rbac:
    enabled: true
    labels: {}

  serviceAccount:
    create: true
    labels: {}
    annotations: {}

    name:

  custom_annotations: {}

  serviceMonitor:

    enabled: false
    
    labels: {}


    annotations: {}

   
    honorLabels: true

   
    metricRelabelings: []

    relabelings: []
    targetLabels: []

  podMonitor:
    enabled: false
    labels: {}

    annotations: {}

    honorLabels: true


    metricRelabelings: []

    relabelings: []


    podTargetLabels: []

  podDisruptionBudget:
    enabled: false


  netpol:
    enabled: false
    from: []

    to: []


  verticalPodAutoscaler:
    enabled: false


 
    controlledResources: []


    maxAllowed: {}
  
    minAllowed: {}


    updatePolicy:

      updateMode: Auto

  volumeMounts: []

  volumes: []

  webhookUrl: ""
